version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: mytai_user
      POSTGRES_PASSWORD: mytai_password
      POSTGRES_DB: mytai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: mytai_ts_user
      POSTGRES_PASSWORD: mytai_ts_password
      POSTGRES_DB: mytai_ts_db
    ports:
      - "5433:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  timescaledb_data:
