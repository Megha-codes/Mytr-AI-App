name: metasync_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.3+4

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^17.2.3
  reactive_forms: ^18.2.2
  fl_chart: ^1.2.0
  shimmer: ^3.0.0
  image_picker: ^1.2.2
  camera: ^0.12.0+1
  dio: ^5.9.2
  dio_smart_retry: ^7.0.0
  flutter_secure_storage: ^9.2.4
  connectivity_plus: ^6.1.3
  cached_network_image: ^3.3.1
  health: ^13.3.1
  flutter_dotenv: ^5.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  http_parser: ^4.1.2
  web_socket_channel: ^3.0.3
  google_fonts: ^8.1.0
  curved_navigation_bar: ^1.0.6
  intl: ^0.20.2
  url_launcher: ^6.3.1
  app_links: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  # Test-only: lets tests install a FakeSecureStoragePlatform (see
  # test/support/) instead of hitting the real platform channel, which has
  # no implementation under `flutter test` and would otherwise make every
  # FlutterSecureStorage read/write/delete a silent no-op.
  flutter_secure_storage_platform_interface: ^1.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/
